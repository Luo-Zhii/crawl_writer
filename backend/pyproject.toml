[project]
name = "crawl-writer"
version = "0.1.0"
description = "Local-first novel crawler: Vietnamese convert + Chinese raw sites, offline reading, EPUB/TXT export."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "ebooklib>=0.18",
    "apscheduler>=3.11",
    "sse-starlette>=2.1",
    "charset-normalizer>=3.4",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
browser = ["playwright>=1.49"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "respx>=0.21",
]

[project.scripts]
crawlw = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; reformatting them adds churn with no benefit.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
